; Relay node: SX1278 only, no sensors. Reuses the libraries of the node firmware (..).
; relay_esp32 = the NodeMCU-32S board (classic ESP32, ESP-32S module); relay = an ESP32-S3 devkit.
[platformio]
default_envs = relay_esp32

[env:relay]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps = sandeepmistry/LoRa, adafruit/Adafruit BME680 Library@^2.0.5, Telemetry
lib_extra_dirs = ../lib
build_flags =
    -I include
    -I ../include
    -I ../src
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D TW_NODE_ID=16

[env:relay_esp32]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 921600
upload_speed = 460800
upload_port = /dev/cu.usbserial-0001      # the NodeMCU-32S (CP2102 USB-serial chip); the gateway is on /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbserial-0001
lib_deps = sandeepmistry/LoRa, adafruit/Adafruit BME680 Library@^2.0.5, Telemetry
lib_extra_dirs = ../lib
build_flags =
    -I include
    -I ../include
    -I ../src
    -std=gnu++17
    -D TW_NODE_ID=16
    -D TW_CONSOLE_BAUD=921600U      # 115200 corrupts reception on this board: see Logger.cpp
    -D TW_SPI_BUS=VSPI
    -D TW_LORA_SCK=18
    -D TW_LORA_MISO=19
    -D TW_LORA_MOSI=23
    -D TW_LORA_CS=5
    -D TW_LORA_RST=14
    -D TW_LORA_DIO0=26

; Same as relay_esp32 plus a channel-energy report every 2 s, to find out whether the radio hears the gateway at all.
[env:relay_esp32_diag]
extends = env:relay_esp32
build_flags =
    ${env:relay_esp32.build_flags}
    -D TW_RF_DIAGNOSTIC=1


; Same as relay_esp32 plus the serial test commands (SEND_DATA <node id> <text>) of the node firmware, to push a data packet through the radio link.
[env:relay_esp32_test]
extends = env:relay_esp32
build_flags =
    ${env:relay_esp32.build_flags}
    -D TW_TEST_MODE=1
