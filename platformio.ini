; Node with the sound classifier (int8 mn10_as on TFLite Micro): the ESP32-S3 N16R8 board on its UART USB port (octal PSRAM), a 6 MB app partition for the 4.3 MB model.
[env:node-acoustic]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
upload_port = /dev/cu.usbmodem5B5E0265961
monitor_port = /dev/cu.usbmodem5B5E0265961
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_acoustic.csv
board_build.embed_files = model/acoustic_mn10_int8.tflite
lib_deps = sandeepmistry/LoRa, adafruit/Adafruit BME680 Library@^2.0.5, nickjgniklu/ESP_TF
build_flags =
	-I include
	-std=gnu++17
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D TW_HEARTBEAT=0
	-D TW_ACOUSTIC_MODEL=1
	-D ACOUSTIC_DEBUG_INTERVAL_MS=1000      ; one MAX4466 level line per second while bringing up the microphones
	-D TW_CONSOLE_BAUD=921600U      ; slower logging corrupts radio reception on these boards (see relay-firmware)
	-D USE_ESP_TF
	-D ESP_NN
	-D CONFIG_NN_OPTIMIZED
	-D ARCH_ESP32_S3
