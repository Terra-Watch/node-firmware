; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

	[env:esp32-s3-devkitm-1]
	platform = espressif32
	board = esp32-s3-devkitm-1
	framework = arduino
	monitor_speed = 115200
	upload_speed = 921600
	board_build.flash_size = 16MB
	board_build.psram = enabled
	lib_deps = sandeepmistry/LoRa
	build_flags =
		-I include
		-std=gnu++17
		-DSIMULATION_MODE

; ── macOS environment (default) ────────────────────────────────────────────────
; pio run                        → build
; pio run --target upload        → upload (auto-detects port)
; pio device monitor             → monitor
[env:esp32-s3-devkitm-1]

; ── Windows environment ────────────────────────────────────────────────────────
; pio run -e windows --target upload   → upload (auto-detects COM port)
; pio device monitor -e windows        → monitor
[env:windows]


