name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make test
  sanitizers:
    name: host tests under sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The test scripts call `c++`; a wrapper earlier in PATH adds AddressSanitizer and UndefinedBehaviorSanitizer to every build.
      - run: |
          mkdir -p "$RUNNER_TEMP/san"
          printf '#!/bin/sh\nexec g++ -fsanitize=address,undefined -fno-sanitize-recover=undefined -g "$@"\n' > "$RUNNER_TEMP/san/c++"
          chmod +x "$RUNNER_TEMP/san/c++"
          PATH="$RUNNER_TEMP/san:$PATH" make test
  simulation:
    name: network simulation check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy
      # The quick run of the multi-hop simulation must finish and write its result file.
      - run: python simulations/multihop/mesh_sim.py quick
  build:
    name: build ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-s3-devkitm-1, node-acoustic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
